<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro">☀ Modo claro</button>

  <h1 class="title">TETRIS</h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="records-panel" class="records-panel" hidden>
          <form id="record-form" class="record-form" hidden>
            <p id="record-msg">¡Entras en el top! Escribe tu nombre</p>
            <div class="record-row">
              <input id="record-name" type="text" maxlength="12" autocomplete="off" placeholder="Tu nombre" />
              <button id="record-save" type="submit">Guardar</button>
            </div>
          </form>
          <ol id="overlay-records" class="records-list"></ol>
          <p id="overlay-totals" class="records-totals"></p>
          <button id="overlay-reset-records" type="button" class="btn-secondary">Borrar records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <p class="records-heading">MEJORES PUNTUACIONES</p>
        <ol id="start-records" class="records-list"></ol>
        <p id="start-totals" class="records-totals"></p>
        <button id="start-reset-records" type="button" class="btn-secondary">Borrar records</button>
        <button id="start-btn" type="button">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
